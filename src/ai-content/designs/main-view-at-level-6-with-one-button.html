<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clicker Game Mockup</title>
  <style>
    body {
      background: #f4f4f4;
      font-family: sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .level-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .progress-bar {
      width: 30px;
      height: 200px;
      background: #ccc;
      border: 2px solid #999;
      position: relative;
      margin-bottom: 10px;
    }

    .progress-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to top, purple, navy);
    }

    .position-title {
      padding: 5px 10px;
      background: #fcc;
      border: 1px solid #a66;
      border-radius: 4px;
      margin-top: 5px;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .work-button {
      padding: 20px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
      background: red;
      border: 4px double black;
      border-radius: 12px;
      cursor: pointer;
    }

    .sticky-note {
      background: #fffacd;
      border: 1px solid #ccc;
      padding: 10px;
      width: 150px;
      transform: rotate(-2deg);
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    .upgrades-box {
      background: #dfd;
      padding: 10px;
      border: 1px solid #090;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>LEVEL 6</div>
    <div>$999</div>
    <div>99 points</div>
    <div>999999 Completed tasks</div>
  </div>

  <div style="display: flex; gap: 50px;">
    <div class="level-indicator">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="position-title">Senior Assistant</div>
    </div>

    <div class="center">
      <button class="work-button">Work</button>
      <div class="upgrades-box">Upgrades Available</div>
    </div>

    <div class="sticky-note">
      <strong>Available position</strong><br />
      Data Analyst
    </div>
  </div>

</body>
</html>
